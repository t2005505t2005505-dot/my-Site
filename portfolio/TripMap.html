        const categoryMap = {
            nature: { icon: 'fa-leaf', color: '#10b981' },

        const regionCenters = {
            all: { lat: 23.8, lng: 121.0, zoom: 7.5 },

            east: { lat: 23.8, lng: 121.3, zoom: 9 },

        // Tile Providers for Layer Switcher
        const tileProviders = {
            street: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
            satellite: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
        };

        let map, clusterGroup, currentTileLayer, routePolyline;
        let activeMarkers = {};
        let currentCategory = 'all';
        let currentRegion = 'all';
        let currentSort = 'default';
        let searchQuery = '';
        let userCoords = null; // { lat, lng }

        let favorites = JSON.parse(localStorage.getItem('taiwan_travel_favs') || '[]');
        let tripList = JSON.parse(localStorage.getItem('taiwan_travel_trip') || '[]');

        // --- Haversine Distance Formula Algorithm ---
        function calculateHaversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Radius of Earth in KM
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; // Distance in km
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([regionCenters.all.lat, regionCenters.all.lng], regionCenters.all.zoom);
            
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            currentTileLayer = L.tileLayer(tileProviders.street, {
                attribution: '&copy; OpenStreetMap, CARTO, Esri',
                maxZoom: 19
            }).addTo(map);

            // Leaflet MarkerCluster Group Upgrade
            clusterGroup = L.markerClusterGroup({
                showCoverageOnHover: false,
                maxClusterRadius: 40
            });
            map.addLayer(clusterGroup);

            // Route Polyline Layer for Trip Planner
            routePolyline = L.polyline([], { color: '#0d9488', weight: 4, opacity: 0.8, dashArray: '8, 8' }).addTo(map);
        }

        function setMapLayer(type) {
            if (tileProviders[type]) {
                currentTileLayer.setUrl(tileProviders[type]);
                ['street', 'satellite', 'dark'].forEach(t => {
                    const btn = document.getElementById(`btn-layer-${t}`);
                    if (t === type) {
                        btn.className = "w-9 h-9 rounded-xl flex items-center justify-center text-brand-600 bg-brand-50 transition font-bold";
                    } else {
                        btn.className = "w-9 h-9 rounded-xl flex items-center justify-center text-slate-600 hover:bg-slate-100 transition";
                    }
                });
            }
        }

        // Live Open-Meteo Weather API Integration
        async function fetchLiveWeather() {
            try {
                // Fetch Taipei coordinates weather
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=25.0339&longitude=121.5644&current_weather=true');
                const data = await res.json();
                if (data && data.current_weather) {
                    const temp = Math.round(data.current_weather.temperature);
                    document.getElementById('weather-text').textContent = `全台即時氣溫：${temp}°C`;
                }
            } catch (err) {
                document.getElementById('weather-text').textContent = `全台氣候宜人 26°C`;
            }
        }

        // Browser Location API
        function getUserLocation() {
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                        
                        // Add User GPS Blue Dot Marker
                        L.circleMarker([userCoords.lat, userCoords.lng], {
                            radius: 8,
                            fillColor: '#3b82f6',
                            color: '#ffffff',
                            weight: 3,
                            opacity: 1,
                            fillOpacity: 0.9
                        }).addTo(map).bindPopup("<b>📍 您的位置</b>").openPopup();

                        map.flyTo([userCoords.lat, userCoords.lng], 12);
                        
                        // Auto switch sort to distance
                        document.getElementById('sort-select').value = 'distance';
                        currentSort = 'distance';
                        renderSpots();
                    },
                    () => alert("無法取得您的定位，請確認已授權定位權限。")
                );
            }
        }

        function renderSpots() {
            // 1. Calculate distances if userCoords exist
            let processedSpots = spotsData.map(spot => {
                let dist = null;
                if (userCoords) {
                    dist = calculateHaversineDistance(userCoords.lat, userCoords.lng, spot.lat, spot.lng);
                }
                return { ...spot, distance: dist };
            });

            // 2. Filter logic
            processedSpots = processedSpots.filter(spot => {
                const matchesCat = (currentCategory === 'all' || spot.category === currentCategory);
                const matchesReg = (currentRegion === 'all' || spot.region === currentRegion);
                const matchesSearch = searchQuery === '' || 
                    spot.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    spot.county.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    spot.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()));

                return matchesCat && matchesReg && matchesSearch;
            });

            // 3. Sorting logic
            if (currentSort === 'rating') {
                processedSpots.sort((a, b) => b.rating - a.rating);
            } else if (currentSort === 'distance' && userCoords) {
                processedSpots.sort((a, b) => (a.distance || 9999) - (b.distance || 9999));
            }

            // Update UI Counters
            document.getElementById('spot-count').textContent = processedSpots.length;

            clusterGroup.clearLayers();
            activeMarkers = {};
            const listContainer = document.getElementById('spots-list');
            listContainer.innerHTML = '';

            if (processedSpots.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 px-4 text-slate-400 space-y-2">
                        <i class="fa-solid fa-compass text-4xl mb-2 text-slate-300"></i>
                        <p class="font-semibold text-xs">沒有找到符合條件的景點</p>
                    </div>`;
                return;
            }

            processedSpots.forEach(spot => {
                const catInfo = categoryMap[spot.category] || { icon: 'fa-location-dot', color: '#0d9488' };
                
                // Map Marker Icon
                const customIcon = L.divIcon({
                    className: 'custom-marker-wrapper',
                    html: `<div class="custom-marker" style="background-color: ${catInfo.color}; width: 32px; height: 32px;">
                            <i class="fa-solid ${catInfo.icon} text-xs"></i>
                           </div>`,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });

                const marker = L.marker([spot.lat, spot.lng], { icon: customIcon });

                const popupContent = `
                    <div class="cursor-pointer" onclick="openDetailModal('${spot.id}')">
                        <img src="${spot.imageUrl}" class="w-full h-28 object-cover">
                        <div class="p-3">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded text-white inline-block mb-1" style="background-color: ${catInfo.color}">
                                ${spot.county}
                            </span>
                            <h4 class="font-bold text-slate-800 text-xs hover:text-brand-600">${spot.title}</h4>
                            <div class="flex items-center justify-between mt-2 text-xs text-slate-500">
                                <span class="text-amber-500 font-bold"><i class="fa-solid fa-star text-xs"></i> ${spot.rating}</span>
                                <span class="text-brand-600 font-semibold text-[11px]">查看詳情 <i class="fa-solid fa-arrow-right text-[9px]"></i></span>
                            </div>
                        </div>
                    </div>`;

                marker.bindPopup(popupContent);
                clusterGroup.addLayer(marker);
                activeMarkers[spot.id] = marker;

                // Card Element UI
                const isFav = favorites.includes(spot.id);
                const isTrip = tripList.includes(spot.id);

                const card = document.createElement('div');
                card.className = "spot-card bg-white rounded-xl p-2.5 shadow-sm hover:shadow-md border border-slate-200/80 transition flex space-x-3 cursor-pointer group";
                
                const distanceBadge = spot.distance !== null ? `<span class="text-[10px] font-bold text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded">📍 ${spot.distance.toFixed(1)} km</span>` : '';

                card.innerHTML = `
                    <div class="w-20 h-20 rounded-lg overflow-hidden flex-shrink-0 relative bg-slate-100">
                        <img src="${spot.imageUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                        <button onclick="event.stopPropagation(); toggleFavorite('${spot.id}')" 
                                class="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/40 hover:bg-black/60 text-white flex items-center justify-center transition">
                            <i class="${isFav ? 'fa-solid text-rose-500' : 'fa-regular'} fa-heart text-[10px]"></i>
                        </button>
                    </div>
                    <div class="flex-1 flex flex-col justify-between py-0.5 min-w-0">
                        <div>
                            <div class="flex items-center space-x-1.5 mb-1">
                                <span class="text-[10px] font-semibold text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded">${spot.county}</span>
                                ${distanceBadge}
                            </div>
                            <h3 class="font-bold text-slate-800 text-xs group-hover:text-brand-600 transition truncate">${spot.title}</h3>
                        </div>
                        <div class="flex items-center justify-between text-xs mt-1">
                            <span class="text-amber-500 font-bold text-xs flex items-center space-x-1">
                                <i class="fa-solid fa-star text-[11px]"></i>
                                <span>${spot.rating}</span>
                            </span>
                            <div class="flex items-center space-x-1">
                                <button onclick="event.stopPropagation(); toggleTrip('${spot.id}')" class="px-2 py-1 rounded text-[11px] font-bold ${isTrip ? 'bg-teal-100 text-brand-700' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                                    ${isTrip ? '✓ 已排' : '+ 行程'}
                                </button>
                                <button onclick="event.stopPropagation(); openDetailModal('${spot.id}')" class="text-xs text-brand-600 font-medium hover:underline">
                                    詳情
                                </button>
                            </div>
                        </div>
                    </div>`;

                card.addEventListener('click', () => {
                    map.flyTo([spot.lat, spot.lng], 14, { duration: 1.2 });
                    marker.openPopup();
                    if (window.innerWidth < 768) switchTab('map');
                });

                listContainer.appendChild(card);
            });

            updateRoutePolyline();
        }

        // Modal Functionality
        function openDetailModal(spotId) {
            const spot = spotsData.find(s => s.id === spotId);
            if (!spot) return;

            document.getElementById('modal-image').src = spot.imageUrl;
            document.getElementById('modal-title').textContent = spot.title;
            document.getElementById('modal-county').textContent = spot.county;
            document.getElementById('modal-category-badge').textContent = spot.categoryLabel;
            document.getElementById('modal-rating').innerHTML = `<i class="fa-solid fa-star"></i> <span>${spot.rating} / 5.0</span>`;
            document.getElementById('modal-stay').textContent = spot.stayTime;
            document.getElementById('modal-hours').textContent = spot.openHours;
            document.getElementById('modal-description').textContent = spot.description;

            const distTag = document.getElementById('modal-distance-tag');
            if (userCoords) {
                const dist = calculateHaversineDistance(userCoords.lat, userCoords.lng, spot.lat, spot.lng);
                distTag.textContent = `距您 ${dist.toFixed(1)} km`;
                distTag.classList.remove('hidden');
            } else {
                distTag.classList.add('hidden');
            }

            document.getElementById('modal-google-maps').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.title + ' ' + spot.county)}`;

            document.getElementById('modal-tags').innerHTML = spot.tags.map(t => `<span class="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg text-xs font-medium"># ${t}</span>`).join('');

            const favBtn = document.getElementById('modal-fav-btn');
            favBtn.onclick = () => { toggleFavorite(spot.id); openDetailModal(spot.id); };
            favBtn.innerHTML = favorites.includes(spot.id) ? `<i class="fa-solid fa-heart text-rose-500"></i><span>已在名單中</span>` : `<i class="fa-regular fa-heart"></i><span>加入口袋名單</span>`;

            const tripBtn = document.getElementById('modal-trip-btn');
            tripBtn.onclick = () => { toggleTrip(spot.id); openDetailModal(spot.id); };
            tripBtn.innerHTML = tripList.includes(spot.id) ? `<i class="fa-solid fa-check text-brand-600"></i><span>已加入行程</span>` : `<i class="fa-solid fa-plus"></i><span>加入行程規劃</span>`;

            // Deep Linking URL history state update
            window.history.replaceState(null, '', `?spot=${spot.id}`);

            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            overlay.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => { overlay.classList.add('hidden'); }, 200);
            window.history.replaceState(null, '', window.location.pathname);
        }

        // Favorite & Trip Drawer Logic
        function toggleFavorite(id) {
            const idx = favorites.indexOf(id);
            if (idx > -1) favorites.splice(idx, 1);
            else favorites.push(id);
            localStorage.setItem('taiwan_travel_favs', JSON.stringify(favorites));
            document.getElementById('fav-count').textContent = favorites.length;
            renderSpots();
            renderFavoritesDrawer();
        }

        function toggleTrip(id) {
            const idx = tripList.indexOf(id);
            if (idx > -1) tripList.splice(idx, 1);
            else tripList.push(id);
            localStorage.setItem('taiwan_travel_trip', JSON.stringify(tripList));
            document.getElementById('trip-count').textContent = tripList.length;
            renderSpots();
            renderTripDrawer();
        }

        function clearTrip() {
            tripList = [];
            localStorage.removeItem('taiwan_travel_trip');
            document.getElementById('trip-count').textContent = 0;
            renderSpots();
            renderTripDrawer();
        }

        function updateRoutePolyline() {
            const latlngs = tripList.map(id => {
                const s = spotsData.find(spot => spot.id === id);
                return s ? [s.lat, s.lng] : null;
            }).filter(Boolean);

            routePolyline.setLatLngs(latlngs);

            // Calculate Total Distance for itinerary
            let totalKm = 0;
            for (let i = 0; i < latlngs.length - 1; i++) {
                totalKm += calculateHaversineDistance(latlngs[i][0], latlngs[i][1], latlngs[i+1][0], latlngs[i+1][1]);
            }
            document.getElementById('trip-distance').textContent = `${totalKm.toFixed(1)} km`;
        }

        function renderFavoritesDrawer() {
            const container = document.getElementById('fav-list');
            container.innerHTML = favorites.length === 0 ? `<p class="text-xs text-slate-400 text-center py-8">目前無收藏景點</p>` : '';

            favorites.forEach(id => {
                const spot = spotsData.find(s => s.id === id);
                if (!spot) return;

                const el = document.createElement('div');
                el.className = "flex items-center justify-between p-2 bg-slate-50 border rounded-xl hover:bg-slate-100 transition";
                el.innerHTML = `
                    <div class="flex items-center space-x-2.5 cursor-pointer flex-1 min-w-0" onclick="openDetailModal('${spot.id}')">
                        <img src="${spot.imageUrl}" class="w-10 h-10 rounded-lg object-cover">
                        <div class="min-w-0 flex-1">
                            <h4 class="text-xs font-bold text-slate-800 truncate">${spot.title}</h4>
                            <p class="text-[11px] text-slate-500">${spot.county}</p>
                        </div>
                    </div>
                    <button onclick="toggleFavorite('${spot.id}')" class="text-slate-400 hover:text-rose-500 p-1.5"><i class="fa-solid fa-trash-can text-xs"></i></button>`;
                container.appendChild(el);
            });
        }

        function renderTripDrawer() {
            const container = document.getElementById('trip-list');
            container.innerHTML = tripList.length === 0 ? `<p class="text-xs text-slate-400 text-center py-8">點擊景點卡片的「+ 行程」即可排入規劃</p>` : '';

            tripList.forEach((id, index) => {
                const spot = spotsData.find(s => s.id === id);
                if (!spot) return;

                const el = document.createElement('div');
                el.className = "flex items-center justify-between p-2.5 bg-teal-50/50 border border-teal-200/60 rounded-xl";
                el.innerHTML = `
                    <div class="flex items-center space-x-2.5 cursor-pointer flex-1 min-w-0" onclick="openDetailModal('${spot.id}')">
                        <span class="w-5 h-5 rounded-full bg-brand-600 text-white font-extrabold text-[10px] flex items-center justify-center flex-shrink-0">${index + 1}</span>
                        <div class="min-w-0 flex-1">
                            <h4 class="text-xs font-bold text-slate-800 truncate">${spot.title}</h4>
                            <p class="text-[10px] text-slate-500">${spot.county}</p>
                        </div>
                    </div>
                    <button onclick="toggleTrip('${spot.id}')" class="text-slate-400 hover:text-rose-500 p-1"><i class="fa-solid fa-xmark text-xs"></i></button>`;
                container.appendChild(el);
            });
        }

        function exportGoogleRoute() {
            if (tripList.length < 2) {
                alert("請至少選擇 2 個景點以進行路線導航規劃！");
                return;
            }
            const waypoints = tripList.map(id => {
                const s = spotsData.find(spot => spot.id === id);
                return `${s.lat},${s.lng}`;
            });
            const origin = waypoints[0];
            const destination = waypoints[waypoints.length - 1];
            const middle = waypoints.slice(1, -1).join('|');

            const url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&waypoints=${middle}&travelmode=driving`;
            window.open(url, '_blank');
        }

        function resetAllFilters() {
            document.getElementById('search-input').value = '';
            searchQuery = '';
            currentCategory = 'all';
            currentRegion = 'all';
            currentSort = 'default';
            document.getElementById('region-filter').value = 'all';
            document.getElementById('sort-select').value = 'default';

            document.querySelectorAll('.cat-pill').forEach(p => p.className = 'cat-pill px-3 py-1 rounded-full font-semibold whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 transition');
            document.querySelector('.cat-pill[data-category="all"]').className = 'cat-pill active px-3 py-1 rounded-full font-semibold whitespace-nowrap bg-brand-600 text-white shadow-sm transition';

            resetMapView();
            renderSpots();
        }

        function resetMapView() {
            map.flyTo([regionCenters.all.lat, regionCenters.all.lng], regionCenters.all.zoom, { duration: 1.2 });
        }

        function switchTab(tab) {
            const sidebar = document.getElementById('sidebar');
            const mapContainer = document.getElementById('map-container');
            if (tab === 'list') {
                sidebar.classList.remove('hidden');
                mapContainer.classList.add('hidden');
            } else {
                sidebar.classList.add('hidden');
                mapContainer.classList.remove('hidden');
                setTimeout(() => map.invalidateSize(), 100);
            }
        }

        // Deep Link Check
        function checkURLDeepLink() {
            const params = new URLSearchParams(window.location.search);
            const spotId = params.get('spot');
            if (spotId) openDetailModal(spotId);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            fetchLiveWeather();
            
            document.getElementById('fav-count').textContent = favorites.length;
            document.getElementById('trip-count').textContent = tripList.length;

            renderSpots();
            renderFavoritesDrawer();
            renderTripDrawer();
            checkURLDeepLink();

            // Event Listeners
            document.getElementById('tab-list').onclick = () => switchTab('list');
            document.getElementById('tab-map').onclick = () => switchTab('map');

            document.getElementById('search-input').addEventListener('input', e => {
                searchQuery = e.target.value.trim();
                document.getElementById('btn-clear-search').classList.toggle('hidden', searchQuery === '');
                renderSpots();
            });

            document.getElementById('btn-clear-search').onclick = () => {
                document.getElementById('search-input').value = '';
                searchQuery = '';
                document.getElementById('btn-clear-search').classList.add('hidden');
                renderSpots();
            };

            document.querySelectorAll('.cat-pill').forEach(pill => {
                pill.onclick = e => {
                    document.querySelectorAll('.cat-pill').forEach(p => p.className = 'cat-pill px-3 py-1 rounded-full font-semibold whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 transition');
                    e.target.className = 'cat-pill active px-3 py-1 rounded-full font-semibold whitespace-nowrap bg-brand-600 text-white shadow-sm transition';
                    currentCategory = e.target.dataset.category;
                    renderSpots();
                };
            });

            document.getElementById('region-filter').onchange = e => {
                currentRegion = e.target.value;
                const reg = regionCenters[currentRegion] || regionCenters.all;
                map.flyTo([reg.lat, reg.lng], reg.zoom, { duration: 1.2 });
                renderSpots();
            };

            document.getElementById('sort-select').onchange = e => {
                currentSort = e.target.value;
                if (currentSort === 'distance' && !userCoords) {
                    getUserLocation();
                } else {
                    renderSpots();
                }
            };

            document.querySelectorAll('.quick-region-btn').forEach(btn => {
                btn.onclick = () => {
                    const regKey = btn.dataset.region;
                    document.getElementById('region-filter').value = regKey;
                    currentRegion = regKey;
                    const reg = regionCenters[regKey];
                    map.flyTo([reg.lat, reg.lng], reg.zoom, { duration: 1.2 });
                    renderSpots();
                };
            });

            document.getElementById('btn-close-modal').onclick = closeModal;
            document.getElementById('modal-overlay').onclick = e => { if (e.target.id === 'modal-overlay') closeModal(); };

            document.getElementById('btn-open-favorites').onclick = () => document.getElementById('fav-drawer').classList.remove('translate-x-full');
            document.getElementById('btn-close-fav').onclick = () => document.getElementById('fav-drawer').classList.add('translate-x-full');

            document.getElementById('btn-open-trip').onclick = () => document.getElementById('trip-drawer').classList.remove('translate-x-full');
            document.getElementById('btn-close-trip').onclick = () => document.getElementById('trip-drawer').classList.add('translate-x-full');
        });
    </script>
</body>
</html>
